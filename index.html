    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        .video-background {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            object-fit: cover; 
            z-index: -1;
        }
        .container {
            position: relative; 
            z-index: 1;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            color: white;
            text-align: center; 
            background: rgba(0,0,0,0.4);
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 2rem; 
            margin-bottom: 0.5rem; 
            letter-spacing: 1px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        p { 
            font-size: 1.1rem; 
            margin-bottom: 2rem; 
            opacity: 0.9; 
            max-width: 500px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .cta-button {
            padding: 15px 40px; 
            background-color: #ffffff;
            color: #000; 
            text-decoration: none;
            border-radius: 5px; 
            font-weight: 600;
            font-size: 1.1rem; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .cta-button:hover { 
            background-color: #eeeeee; 
            transform: scale(1.03);
        }
        /* Tombol Play/Pause Manual untuk HP */
        .play-btn {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Background Video langsung dari server -->
    <video id="bgVideo" autoplay muted loop playsinline class="video-background">
        <source src="https://meet4ndconn3ct-37ml.github.io/join/video1.mp4" type="video/mp4">
    </video>
    
    <div class="container">
        <h1>THE PERSONAL ARCHIVE</h1>
        <p>Beyond the public view, this is where I keep my unfiltered thoughts. A private space for genuine connections.</p>
        <a href="https://blue-sky-75aa96.netlify.app" class="cta-button">STEP INTO MY WORLD</a>
        
        <!-- Tombol Kontrol Video jika autoplay terblokir -->
        <button class="play-btn" onclick="togglePlay()">▶ Play / Pause Video</button>
    </div>

    <script>
        const video = document.getElementById('bgVideo');

        // Memastikan video otomatis terputar saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            video.play().catch(() => {
                console.log("Autoplay terblokir oleh browser HP, silakan tekan tombol Play manual.");
            });
        });

        // Fungsi Tombol Play / Pause
        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
    </script>
</body>
